development:
  adapter: redis
  url: <%= ENV.fetch("REDIS_URL") { "redis://localhost:6379/0" } %>

test:
  adapter: test

production:
  # Use async adapter when Redis is not available (Azure deployment)
  # For production with Redis, set REDIS_URL environment variable
  adapter: <%= ENV.fetch("REDIS_URL", nil) ? "redis" : "async" %>
  url: <%= ENV.fetch("REDIS_URL") { "redis://localhost:6379/1" } %>
  channel_prefix: inspection_cms_production
