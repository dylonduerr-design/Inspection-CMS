<!DOCTYPE html>
<html>
<head>
  <title>Offline - Inspection CMS</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .offline-container {
      text-align: center;
      padding: 2rem;
      max-width: 500px;
    }
    .offline-icon {
      font-size: 5rem;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
    }
    p {
      font-size: 1.1rem;
      margin-bottom: 2rem;
      opacity: 0.9;
    }
    .retry-btn {
      background: white;
      color: #667eea;
      padding: 12px 32px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }
    .retry-btn:hover {
      transform: translateY(-2px);
    }
    .info {
      margin-top: 2rem;
      padding: 1rem;
      background: rgba(255,255,255,0.1);
      border-radius: 8px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-icon">📡</div>
    <h1>You're Offline</h1>
    <p>This page isn't available offline. Your pending changes are saved and will sync when you're back online.</p>
    <button class="retry-btn" onclick="window.location.reload()">Try Again</button>
    
    <div class="info">
      <strong>Offline Features Available:</strong><br>
      • Create new reports<br>
      • Fill out checklists<br>
      • Take notes<br>
      • Attach photos
    </div>
  </div>
</body>
</html>
